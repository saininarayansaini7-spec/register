<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>भूलेख LIVE - मेरे ऐप में</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f1f5f9}
.live{background:#0e5a37;color:#fff;text-align:center;padding:6px;font-size:11px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
.head{background:#fff;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #0e5a37}
.head img{width:60px;height:60px;border-radius:50%;border:2px solid #0e5a37}
.card{margin:10px;background:#fff;border-radius:14px;padding:12px}
.inp,select{width:100%;padding:12px;border-radius:10px;border:1.5px solid #ccc;background:#f8fafc;margin-top:8px}
.btn{width:100%;background:#0e5a37;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}
.frame{display:none;margin:10px;background:#fff;border-radius:14px;overflow:hidden;border:2px solid #0e5a37}
.fhead{background:#0e5a37;color:#fff;padding:8px;display:flex;justify-content:space-between;font-size:12px}
iframe{width:100%;height:80vh;border:none}
</style>
</head>
<body>

<div class="live"><span class="dot"></span> 🔴 LIVE HAI ABHI - <span id="t"></span></div>

<div class="head">
<img src="https://upbhulekh.gov.in/img/logo.png">
<h1 style="font-size:14px">भूलेख - खतौनी<span style="display:block;font-weight:900">राजस्व परिषद उत्तर प्रदेश</span></h1>
</div>

<div class="card" id="box">
<select id="jila" class="inp">
<option>Muzaffarnagar (मुजफ्फरनगर)</option>
<option>Saharanpur (सहारनपुर)</option>
<option>Shamli (शामली)</option>
<option>Meerut (मेरठ)</option>
<option>Baghpat (बागपत)</option>
</select>

<select id="teh" class="inp">
<option>Sadar (सदर)</option>
<option>Jansath (जानसठ)</option>
<option>Budhana (बुढ़ाना)</option>
<option>Khatauli (खतौली)</option>
</select>

<input id="gaon" class="inp" placeholder="गाँव का नाम लिखें">
<input id="khasra" class="inp" placeholder="खसरा / गाटा नंबर">

<button onclick="kholo()" class="btn">📄 मेरे ऐप में ही नकल खोलो</button>
</div>

<div class="frame" id="fr">
<div class="fhead"><span id="ft">LIVE नकल</span><span onclick="band()" style="background:red;padding:4px 10px;border-radius:6px">✕ बंद</span></div>
<iframe id="f"></iframe>
</div>

<script>
function kholo(){
let j=document.getElementById('jila').value;
let t=document.getElementById('teh').value;
let g=document.getElementById('gaon').value;
let k=document.getElementById('khasra').value;
document.getElementById('ft').innerText=j+' / '+t+' / '+g+' '+k;
document.getElementById('fr').style.display='block';
document.getElementById('box').style.display='none';
document.getElementById('f').src='https://upbhulekh.gov.in/';
}
function band(){
document.getElementById('fr').style.display='none';
document.getElementById('box').style.display='block';
document.getElementById('f').src='';
}
setInterval(()=>{document.getElementById('t').innerText=new Date().toLocaleTimeString('hi-IN')},1000);
</script>
</body>
</html>
