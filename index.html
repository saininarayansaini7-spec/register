<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mera Adhikar - All Features</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Noto Sans Devanagari}
body{background:#fdf8f3}
.top{background:#f97316;color:#fff;padding:20px 16px 28px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:10}
.top h1{font-size:22px}.top p{font-size:11px;opacity:.9;margin-top:2px}
.search{margin:-16px 12px 8px;background:#fff;padding:12px 14px;border-radius:14px;box-shadow:0 6px 16px #0001;display:flex;gap:8px;position:sticky;top:74px;z-index:9}
.search input{flex:1;border:0;outline:none;font-size:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.cats button{flex:0 0 auto;padding:6px 12px;border-radius:20px;border:1px solid #fed7aa;background:#fff;font-size:12px}
.cats button.active{background:#ea580c;color:#fff}
.card{background:#fff;margin:10px 12px;border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px #0001;cursor:pointer}
.icon{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:32px;background:#fff7ed;flex:0 0 60px}
.card h3{font-size:14px;color:#1e293b;line-height:1.2}.card p{font-size:11px;color:#64748b;margin-top:2px}
.badge{font-size:10px;padding:3px 8px;border-radius:8px;display:inline-block;margin-top:4px}
.b1{background:#dbeafe;color:#1e40af}.b2{background:#dcfce7;color:#166534}.b3{background:#fef3c7;color:#92400e}.b4{background:#f3e8ff;color:#6b21a8}
#detail{position:fixed;inset:0;background:#fff;z-index:100;display:none;overflow:auto}
#detail.on{display:block}
.d-head{background:#f97316;color:#fff;padding:14px;display:flex;gap:10px;align-items:center;position:sticky;top:0}
.d-head button{background:#fff;color:#f97316;border:0;padding:6px 12px;border-radius:8px;font-weight:700}
.d-body{padding:12px}.box{background:#f8fafc;border-radius:14px;padding:12px;margin:10px 0}
.box h4{font-size:13px;color:#c2410c;margin-bottom:5px}.box li,.box p{font-size:13px;line-height:1.6;color:#334155}
.inp{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;font-size:14px}
.btn{width:100%;background:#16a34a;color:#fff;padding:14px;border:0;border-radius:12px;font-size:15px;margin-top:10px}
.nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #f1f5f9}
</style>
</head>
<body>
<div class="top"><h1>🇮🇳 Mera Adhikar</h1><p>Bharat + UP - 50+ Yojana - 100% Offline</p></div>
<div class="search">🔍 <input id="q" placeholder="खोजें... लैपटॉप, गन्ना, पेंशन, आवास"></div>
<div class="cats" id="cats"></div>
<div id="list" style="padding-bottom:70px"></div>
<div id="detail"><div class="d-head"><button onclick="closeD()">← वापस</button><b id="dt"></b></div><div class="d-body" id="db"></div></div>

<script>
const allYojanas=[
{cat:"mahila",icon:"👧",name:"Kanya Sumangala Yojana",short:"बेटी को ₹15000 - 6 किस्तों में",badge:"₹15000",cls:"b1",ben:"जन्म पर 2000, 1 साल पर 1000, Class 1 में 2000, Class 6 में 2000, Class 9 में 3000, Graduation में 5000",elig:["UP निवासी","आय 3 लाख से कम"],doc:["आधार","जन्म प्रमाण","आय प्रमाण"],step:["mksy.up.gov.in खोलें","आवेदन करें"]},
{cat:"yuva",icon:"💻",name:"UP Free Laptop Yojana",short:"12वीं में 65%+ पर फ्री लैपटॉप",badge:"फ्री लैपटॉप",cls:"b2",ben:"मेधावी छात्रों को फ्री लैपटॉप",elig:["UP बोर्ड से 12वीं","65%+ अंक"],doc:["मार्कशीट","आधार"],step:["स्कूल से लिस्ट चेक करें"]},
{cat:"kisan",icon:"🌾",name:"Ganna Parchi Dekho",short:"गन्ना पर्ची, भुगतान ऑनलाइन",badge:"पर्ची देखें",cls:"b3",ben:"घर बैठे पर्ची देखें",elig:["गन्ना किसान"],doc:["गन्ना कोड"],step:["enquiry.caneup.in खोलें"]},
{cat:"pension",icon:"👴",name:"UP Vridha Pension",short:"60+ को ₹1000 महीना",badge:"₹1000/माह",cls:"b4",ben:"हर महीने ₹1000",elig:["उम्र 60+","आय 48000 से कम"],doc:["आधार","आयु प्रमाण"],step:["sspy-up.gov.in पर जाएं"]},
{cat:"garib",icon:"🏠",name:"PM Awas Yojana",short:"गरीबों को पक्का मकान",badge:"₹2.67 लाख",cls:"b1",ben:"1.20 लाख गांव में, 2.67 लाख शहर में",elig:["BPL परिवार"],doc:["आधार","जॉब कार्ड"],step:["pmaymis.gov.in"]},
{cat:"mahila",icon:"👩‍💼",name:"BC Sakhi Yojana",short:"महिला को ₹4000 महीना",badge:"₹4000 महीना",cls:"b4",ben:"बैंक सखी बनने पर",elig:["10वीं पास महिला"],doc:["आधार"],step:["bc-sakhi.in"]},
{cat:"garib",icon:"💍",name:"Samuhik Vivah Yojana",short:"गरीब बेटी शादी पर ₹51000",badge:"₹51000",cls:"b1",ben:"शादी पर ₹51000",elig:["BPL परिवार"],doc:["आय प्रमाण"],step:["cmsvy.upsdc.gov.in"]},
{cat:"yuva",icon:"📱",name:"Tablet Smartphone Yojana",short:"छात्रों को फ्री टैबलेट",badge:"फ्री टैबलेट",cls:"b2",ben:"फ्री टैबलेट / स्मार्टफोन",elig:["UP कॉलेज में पढ़ाई"],doc:["कॉलेज ID"],step:["digishakti.up.gov.in"]},
];
const cats=[{id:"all",n:"सभी"},{id:"kisan",n:"किसान"},{id:"mahila",n:"महिला"},{id:"yuva",n:"युवा"},{id:"pension",n:"पेंशन"},{id:"garib",n:"गरीब"}];
document.getElementById('cats').innerHTML=cats.map(c=>`<button data-c="${c.id}" class="${c.id=='all'?'active':''}">${c.n}</button>`).join('');
let curCat="all";
function render(){
 const q=document.getElementById('q').value.toLowerCase();
 const filtered=allYojanas.filter(y=>(curCat=="all"||y.cat==curCat)&&(y.name.toLowerCase()+y.short.toLowerCase()).includes(q));
 document.getElementById('list').innerHTML=filtered.map((d,i)=>`<div class="card" onclick="openD(${allYojanas.indexOf(d)})"><div class="icon">${d.icon}</div><div><h3>${d.name}</h3><p>${d.short}</p><span class="badge ${d.cls}">${d.badge}</span></div><div style="margin-left:auto">›</div></div>`).join('');
}
function openD(idx){
 const d=allYojanas[idx];
 document.getElementById('dt').innerText=d.name;
 document.getElementById('db').innerHTML=`<div style="text-align:center;font-size:64px;margin:8px 0">${d.icon}</div><div class="box"><h4>💰 फायदा</h4><p>${d.ben}</p></div><div class="box"><h4>✅ पात्रता</h4><ul>${d.elig.map(e=>`<li>${e}</li>`).join('')}</ul></div><div class="box"><h4>📄 कागज</h4><ul>${d.doc.map(e=>`<li>${e}</li>`).join('')}</ul></div><div class="box"><h4>📝 स्टेप</h4><ol>${d.step.map(e=>`<li>${e}</li>`).join('')}</ol></div><div class="box"><h4>📝 Offline Form</h4><input class="inp" placeholder="पूरा नाम"><input class="inp" placeholder="मोबाइल नंबर"><input class="inp" placeholder="जिला"><button class="btn" onclick="alert('फॉर्म सेव हो गया! (Offline)')">फॉर्म सेव करें</button></div>`;
 document.getElementById('detail').classList.add('on');
}
function closeD(){document.getElementById('detail').classList.remove('on')}
document.getElementById('q').addEventListener('input',render);
document.getElementById('cats').addEventListener('click',e=>{ if(e.target.tagName=='BUTTON'){document.querySelectorAll('#cats button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');curCat=e.target.dataset.c;render()}});
render();
</script>
</body>
</html>
